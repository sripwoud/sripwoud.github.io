[tasks.build]
alias = "b"
description = "Build the project"
run = ["bun tsc -b", "bun vite build"]
quiet = true

[tasks."check:format"]
hide = true
run = "dprint check"

[tasks."check:lint"]
hide = true
run = "biome check"

[tasks."check:types"]
hide = true
run = "tsc -b"

[tasks.check]
alias = "c"
depends = ["check:*"]
description = "Check formatting, lint and types"

[tasks.dev]
alias = "d"
description = "Start the dev server"
run = "bun vite"
quiet = true

[tasks.fmt]
hide = true
run = "dprint fmt"

[tasks.lint]
hide = true
run = "biome check --fix"

[tasks.fix]
alias = "f"
depends = ["fmt", "lint"]
description = "Format and fix lint issues"

[tasks.preview]
alias = "p"
description = "Preview the app"
run = "bun vite preview"
quiet = true

[tools]
bun = "latest"
dprint = "latest"
hk = "1.47.0"
"npm:@biomejs/biome" = "2.5.9"
"github:convco/convco" = "latest"
"npm:typescript" = "7.0.2"
pkl = "latest"
